# C:\CodexApp\docker-compose.yml
services:
  codex:
    build: .
    volumes:
      - ./src:/usr/src/app                # Mount full project so all local folders are available
      - ${CODEX_AZURE_HOST_CONFIG_DIR:-${HOME}/.azure-for-docker}:/root/.azure
    working_dir: /usr/src/app
    environment:
      AZURE_CONFIG_DIR: /root/.azure
      AZURE_OPENAI_DOMAIN: ${AZURE_OPENAI_DOMAIN:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-04-01-preview}
      AZURE_OPENAI_TOKEN_RESOURCE: ${AZURE_OPENAI_TOKEN_RESOURCE:-https://cognitiveservices.azure.com/}
      CODEX_MODEL_REASONING_EFFORT: ${CODEX_MODEL_REASONING_EFFORT:-high}
      CODEX_AZURE_AUTH_REFRESH_INTERVAL_MS: ${CODEX_AZURE_AUTH_REFRESH_INTERVAL_MS:-300000}
      CODEX_AZURE_AUTH_TIMEOUT_MS: ${CODEX_AZURE_AUTH_TIMEOUT_MS:-5000}
    tty: true                      # Keep the shell open for interaction
